# ForgeOS web frontend on Fly.io — static SPA on nginx.
# Deploy from the repo root:
#   fly deploy --config deploy/fly/web.toml .
# (The Dockerfile path is read from [build] below; repo root stays the context.)
app = "forgeos-web"
primary_region = "dfw"

[build]
  dockerfile = "deploy/fly/Dockerfile.web"
  [build.args]
    # The browser calls the API directly (CORS is open by default, see config).
    VITE_API_URL = "https://forgeos-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
