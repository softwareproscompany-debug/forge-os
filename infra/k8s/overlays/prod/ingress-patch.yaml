# Prod ingress: real host + TLS. Uncomment the cert-manager annotation and the
# tls block once cert-manager (or your certificate issuer) is installed and
# the DNS record for the host exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeos
  namespace: forgeos
  annotations:
    kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:
  #   - hosts:
  #       - app.forgeos.example.com
  #     secretName: forgeos-tls
  rules:
    - host: app.forgeos.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
