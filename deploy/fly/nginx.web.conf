# ForgeOS web on Fly.io — pure static SPA.
# The browser calls the API directly at VITE_API_URL (baked in at build time),
# so no /api/ proxy is needed here (unlike docker-compose).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
