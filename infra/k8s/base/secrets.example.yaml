  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_WITH_64_RANDOM_HEX_CHARS"
  WEBHOOK_SECRET: "REPLACE_ME"
  ANTHROPIC_API_KEY: ""
  OPENAI_COMPAT_BASE_URL: ""
  OPENAI_COMPAT_API_KEY: ""
  OPENAI_COMPAT_MODEL: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SENDGRID_API_KEY: ""
  SES_REGION: ""
  SES_ACCESS_KEY: ""
  SES_SECRET_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
  SOCIAL_META_PAGE_TOKEN: ""
  SOCIAL_LINKEDIN_TOKEN: ""
  SOCIAL_X_API_KEY: ""
  SOCIAL_X_API_SECRET: ""
