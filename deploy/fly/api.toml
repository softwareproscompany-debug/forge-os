# ForgeOS API on Fly.io — FastAPI + Alembic migrations via release command.
# Deploy from the repo root:
#   fly deploy --config deploy/fly/api.toml --dockerfile apps/api/Dockerfile .
app = "forgeos-api"
primary_region = "dfw"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Runs Alembic migrations before each deploy. Secrets (DATABASE_URL) are
  # available to the release command.
  release_command = "sh -c 'cd /srv/forge-os/packages/forge-db && alembic -c alembic/alembic.ini upgrade head'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
