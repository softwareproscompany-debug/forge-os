[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-db"
version = "0.1.0"
description = "ForgeOS database models, session helpers, and Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy==2.1.3",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["forge_db*"]
