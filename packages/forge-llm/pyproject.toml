[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-llm"
version = "0.1.0"
description = "LLM abstraction layer for ForgeOS: providers, prompt registry, brand helpers, costing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "anthropic==1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_llm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
