[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-channels"
version = "0.1.0"
description = "Multi-channel send abstraction for ForgeOS: email, SMS, social providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_channels*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
