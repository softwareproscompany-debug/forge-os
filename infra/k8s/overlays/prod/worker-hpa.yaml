apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: forgeos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  # Worker scales on job queue depth (CPU is a lagging proxy for arq).
  # If you install prometheus-adapter, swap the CPU metric for the
  # arq queue-length custom metric on the `forge` queue.
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
