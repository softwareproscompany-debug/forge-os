# ForgeOS production deploy to Fly.io.
#
# What it does (everything is idempotent — safe to re-run):
#   1. Ensures the three apps exist (forgeos-api-app, forgeos-worker, forgeos-web)
#   2. Ensures the forgeos-db Postgres cluster exists and attaches it to api + worker
#      (both apps share ONE database, "forgeos", so the worker sees the tables the api migrates)
#   3. Creates the forgeos-redis Upstash Redis (once) and sets REDIS_URL on api + worker
#   4. Generates JWT_SECRET / WEBHOOK_SECRET (once, identical on api + worker)
#   5. Allocates public IPs for api + web
#   6. Deploys api (Alembic migrations run first), then worker, then web
#   7. Smoke-tests the live endpoints with retries
#
# This repo is PUBLIC, so Actions logs are public: never print connection strings.
# flyctl prints the DB password / Redis URL on create + attach, so stdout is discarded below.
#
# Required repo secret: FLY_API_TOKEN (Fly.io account/company token, full access)
# Trigger: every push to main, or manual (Actions → "Deploy ForgeOS to Fly.io").

name: Deploy ForgeOS to Fly.io

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Two deploys at once would race on secrets, IPs and migrations.
concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Provision + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify FLY_API_TOKEN is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set. Add it to repo settings."
            exit 1
          fi

      - name: Dependency scan (Python)
        run: |
          pip install pip-audit
          pip-audit --desc --format=json --output=/tmp/pip-audit.json -r apps/api/requirements.txt || true
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open('/tmp/pip-audit.json'))
          except Exception:
              print("pip-audit produced no JSON; continuing without blocking deployment")
              sys.exit(0)
          vulns = [
              (d.get("name"), v)
              for d in data.get("dependencies", [])
              for v in d.get("vulns", [])
          ]
          if vulns:
              print(f"::warning::Detected {len(vulns)} known Python advisories; reporting only")
              for name, v in vulns[:15]:
                  print(f" - {name}: {v.get('id')} (fix: {','.join(v.get('fix_versions', [])) or 'none'})")
          else:
              print("pip-audit clean: no known vulnerabilities")
          EOF

      - name: Dependency scan (Node)
        working-directory: apps/web
        run: npm audit --audit-level=high || true

      - name: Container / IaC scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

      - name: Ensure apps exist
        run: |
          # Exact-name match on the first column (a substring grep would let
          # "forgeos-web" match "forgeos-web-old").
          has_name() { awk -v n="$1" '$1==n{f=1} END{exit !f}'; }
          apps=$(flyctl apps list 2>/dev/null || true)
          for app in forgeos-api-app forgeos-worker forgeos-web; do
            if has_name "$app" <<<"$apps"; then
              echo "✓ App $app already exists"
            else
              echo "Creating app $app..."
              # Fly app names are globally unique; this fails loudly if the name is taken.
              flyctl apps create "$app" --org personal
            fi
          done

      - name: Ensure Postgres exists
        run: |
          has_name() { awk -v n="$1" '$1==n{f=1} END{exit !f}'; }
          pgs=$(flyctl postgres list 2>/dev/null || true)
          if has_name forgeos-db <<<"$pgs"; then
            echo "✓ Postgres forgeos-db already exists"
          else
            echo "Creating Postgres cluster (this takes ~60s)..."
            # stdout discarded: it contains the superuser password (public logs).
            flyctl postgres create \
              --name forgeos-db \
              --region dfw \
              --initial-cluster-size 1 \
              --vm-size shared-cpu-1x \
              --volume-size 10 \
              --org personal >/dev/null
            echo "✓ Postgres forgeos-db created"
          fi

      - name: Attach Postgres to api + worker
        run: |
          for app in forgeos-api-app forgeos-worker; do
            secrets=$(flyctl secrets list --app "$app" 2>/dev/null || true)
            if grep -qw 'DATABASE_URL' <<<"$secrets"; then
              echo "✓ DATABASE_URL already set on $app"
            else
              echo "Attaching forgeos-db to $app..."
              # Same --database-name for both apps. Without it Fly creates one
              # database per app (forgeos_api_app / forgeos_worker), and the worker
              # would query an empty database that no migration ever touched.
              # stdout discarded: it prints the full DATABASE_URL incl. password.
              flyctl postgres attach forgeos-db --app "$app" --database-name forgeos --yes >/dev/null
              echo "✓ Attached to $app"
            fi
          done

      - name: Ensure Redis + app secrets
        run: |
          has_name() { awk -v n="$1" '$1==n{f=1} END{exit !f}'; }

          echo "Checking Redis..."
          redis=$(flyctl redis list 2>/dev/null || true)
          if has_name forgeos-redis <<<"$redis"; then
            echo "✓ Redis forgeos-redis already exists"
          else
            echo "Creating Upstash Redis (this takes ~30s)..."
            # stdout discarded: it contains the Redis URL with its password.
            # --disable-eviction: this is the arq job queue, so reject writes when
            # full rather than silently dropping queued jobs.
            flyctl redis create \
              --name forgeos-redis \
              --region dfw \
              --no-replicas \
              --disable-eviction \
              --org personal >/dev/null
          fi

          # Read the URL from status in both cases (one code path), mask it, then use it.
          REDIS_URL=$(flyctl redis status forgeos-redis 2>/dev/null | grep -oE 'redis://[^[:space:]"]+' | head -1 || true)
          if [ -z "$REDIS_URL" ]; then
            echo "::error::Could not read the Redis URL from 'flyctl redis status forgeos-redis'"
            exit 1
          fi
          echo "::add-mask::$REDIS_URL"

          # --stage everywhere below: secrets are applied by the deploy steps that
          # follow, instead of restarting running machines once per secrets call.
          for app in forgeos-api-app forgeos-worker; do
            secrets=$(flyctl secrets list --app "$app" 2>/dev/null || true)
            if ! grep -qw 'REDIS_URL' <<<"$secrets"; then
              flyctl secrets set --stage --app "$app" "REDIS_URL=$REDIS_URL"
              echo "✓ REDIS_URL set on $app"
            fi
          done

          # JWT_SECRET / WEBHOOK_SECRET must be IDENTICAL on api and worker, so
          # generate once and set on both. (Generating inside the per-app loop gave
          # each app a different secret.)
          need_secrets=0
          for app in forgeos-api-app forgeos-worker; do
            secrets=$(flyctl secrets list --app "$app" 2>/dev/null || true)
            grep -qw 'JWT_SECRET' <<<"$secrets" || need_secrets=1
          done
          if [ "$need_secrets" = "1" ]; then
            JWT=$(openssl rand -hex 32)
            WH=$(openssl rand -hex 32)
            echo "::add-mask::$JWT"
            echo "::add-mask::$WH"
            for app in forgeos-api-app forgeos-worker; do
              flyctl secrets set --stage --app "$app" "JWT_SECRET=$JWT" "WEBHOOK_SECRET=$WH"
            done
            echo "✓ JWT_SECRET / WEBHOOK_SECRET generated for api + worker"
          else
            echo "✓ JWT_SECRET / WEBHOOK_SECRET already set on both apps"
          fi

          # Provider defaults are set ONLY when missing. Setting them unconditionally
          # reset LLM_PROVIDER / CHANNEL_MODE back to "stub" on every push, undoing
          # any later switch to real providers.
          for app in forgeos-api-app forgeos-worker; do
            secrets=$(flyctl secrets list --app "$app" 2>/dev/null || true)
            grep -qw 'LLM_PROVIDER' <<<"$secrets" || flyctl secrets set --stage --app "$app" LLM_PROVIDER=stub
            grep -qw 'CHANNEL_MODE' <<<"$secrets" || flyctl secrets set --stage --app "$app" CHANNEL_MODE=stub
          done

          # Production hardening (api): fail-closed JWT strength check, CORS wildcard
          # refusal, HSTS. CORS_ORIGINS must be explicit (the code default is localhost).
          flyctl secrets set --stage --app forgeos-api-app \
            ENV=production \
            CORS_ORIGINS=https://forgeos-web.fly.dev

      - name: Ensure public IPs for api + web
        run: |
          for app in forgeos-api-app forgeos-web; do
            ips=$(flyctl ips list --app "$app" 2>/dev/null || true)
            # Ignore "private" rows: every app has a private v6 address, which must
            # not count as a public one.
            v4=$(grep -E '(^|[[:space:]])v4[[:space:]]' <<<"$ips" | grep -v private || true)
            v6=$(grep -E '(^|[[:space:]])v6[[:space:]]' <<<"$ips" | grep -v private || true)
            # --shared: free. A dedicated IPv4 is billed monthly.
            if [ -z "$v4" ]; then flyctl ips allocate-v4 --shared --app "$app" --yes; else echo "✓ $app has IPv4"; fi
            if [ -z "$v6" ]; then flyctl ips allocate-v6 --app "$app" --yes; else echo "✓ $app has IPv6"; fi
          done

      - name: Deploy API (runs Alembic migrations first)
        timeout-minutes: 20
        run: |
          echo "Deploying API..."
          flyctl deploy \
            --remote-only \
            --config deploy/fly/api.toml . || {
            echo "::error::API deployment failed"
            exit 1
          }
          echo "✓ API deployed successfully"

      - name: Deploy worker
        timeout-minutes: 15
        run: |
          echo "Deploying worker..."
          flyctl deploy \
            --remote-only \
            --config deploy/fly/worker.toml . || {
            echo "::error::Worker deployment failed"
            exit 1
          }
          echo "✓ Worker deployed successfully"

      - name: Deploy web
        timeout-minutes: 15
        run: |
          echo "Deploying web..."
          flyctl deploy \
            --remote-only \
            --config deploy/fly/web.toml . || {
            echo "::error::Web deployment failed"
            exit 1
          }
          echo "✓ Web deployed successfully"

      - name: Smoke test live endpoints (with retries)
        timeout-minutes: 5
        run: |
          check() {
            for i in $(seq 1 15); do
              if curl -sf -o /dev/null "$1"; then echo "✓ OK: $1"; return 0; fi
              echo "Attempt $i/15: waiting for $1..."
              sleep 5
            done
            echo "::error::Smoke test failed for $1"
            return 1
          }
          check https://forgeos-api-app.fly.dev/healthz
          check https://forgeos-web.fly.dev/
          echo "✓ All smoke tests passed"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## ✅ Deployment Complete"
            echo ""
            echo "### Access your ForgeOS instance:"
            echo "- **App**: https://forgeos-web.fly.dev"
            echo "- **API**: https://forgeos-api-app.fly.dev"
            echo "- **Logs**: \`fly logs --app forgeos-api-app\`"
            echo ""
            echo "### Next steps:"
            echo "1. Log in and verify the FORGE flow (generate → approve → send)"
            echo "2. Add LLM credentials to go live: \`flyctl secrets set --app forgeos-api-app ANTHROPIC_API_KEY=...\`"
            echo "3. Set \`CHANNEL_MODE=live\` and add provider keys for email/SMS/social"
            echo "4. See \`KEYS.md\` for per-provider setup instructions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment failed summary
        if: failure()
        run: |
          {
            echo "## ❌ Deployment Failed"
            echo ""
            echo "### Debug steps:"
            echo "1. Check app status: \`flyctl status --app forgeos-api-app\`"
            echo "2. View logs: \`flyctl logs --app forgeos-api-app\`"
            echo "3. Verify secrets: \`flyctl secrets list --app forgeos-api-app\`"
            echo "4. Check Redis: \`flyctl redis status forgeos-redis\`"
            echo "5. See workflow logs above for specific error messages"
          } >> "$GITHUB_STEP_SUMMARY"
