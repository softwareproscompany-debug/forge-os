# Dependabot — automated dependency updates for ForgeOS.
# Keeps packages current and vulnerabilities out. Security updates
# are opened immediately; version updates are grouped weekly.
version: 2
updates:
  # Python — API runtime + workspace packages
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    # Group non-security updates to reduce PR noise; security
    # updates still arrive as separate, immediate PRs.
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python — workspace packages (forge-db, forge-llm, forge-channels)
  - package-ecosystem: "pip"
    directory: "/packages/forge-db"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]

  - package-ecosystem: "pip"
    directory: "/packages/forge-llm"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]

  - package-ecosystem: "pip"
    directory: "/packages/forge-channels"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]

  # Node — web frontend
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions — pinned action versions in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]

  # Docker — base image updates (python:3.12-slim, nginx, node)
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/deploy/fly"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
