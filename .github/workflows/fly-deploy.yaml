# ForgeOS production deploy to Fly.io.
#
# What it does (everything is idempotent — safe to re-run):
#   1. Ensures the three apps exist (forgeos-api-app, forgeos-worker, forgeos-web)
#   2. Attaches the forgeos-db Postgres cluster to api + worker (sets DATABASE_URL)
#   3. Creates the forgeos-redis Upstash Redis (once) and sets REDIS_URL on api + worker
#   4. Generates JWT_SECRET / WEBHOOK_SECRET (once) on api + worker
#   5. Allocates public IPs for api + web
#   6. Deploys api (Alembic migrations run first), then worker, then web
#   7. Smoke-tests the live endpoints
#
# Required repo secret: FLY_API_TOKEN (Fly.io account/company token, full access)
# Trigger: every push to main, or manual (Actions → "Deploy ForgeOS to Fly.io").

name: Deploy ForgeOS to Fly.io

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Provision + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Dependency scan (Python)
        run: |
          pip install pip-audit
          pip-audit --desc --format=json --output=/tmp/pip-audit.json -r apps/api/requirements.txt || true
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open('/tmp/pip-audit.json'))
          except Exception:
              print("pip-audit produced no JSON; continuing without blocking deployment")
              sys.exit(0)
          vulns = [
              (d.get("name"), v)
              for d in data.get("dependencies", [])
              for v in d.get("vulns", [])
          ]
          if vulns:
              print(f"::warning::Detected {len(vulns)} known Python advisories; reporting only")
              for name, v in vulns[:15]:
                  print(f" - {name}: {v.get('id')} (fix: {','.join(v.get('fix_versions', [])) or 'none'})")
          else:
              print("pip-audit clean: no known vulnerabilities")
          EOF

      - name: Dependency scan (Node)
        working-directory: apps/web
        run: npm audit --audit-level=high || true

      - name: Container / IaC scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          format: 'table'

      - name: Ensure apps exist
        run: |
          for app in forgeos-api-app forgeos-worker forgeos-web; do
            flyctl apps create "$app" --org personal 2>&1 | tail -1 || true
          done

      - name: Attach Postgres to api + worker
        run: |
          for app in forgeos-api-app forgeos-worker; do
            if flyctl secrets list --app "$app" 2>/dev/null | grep -q 'DATABASE_URL'; then
              echo "DATABASE_URL already set on $app — skipping attach."
            else
              echo "Attaching forgeos-db to $app..."
              flyctl postgres attach forgeos-db --app "$app" --yes 2>&1 | tail -2
            fi
          done

      - name: Ensure Redis + app secrets
        run: |
          if flyctl redis list 2>/dev/null | grep -q 'forgeos-redis'; then
            echo "Redis forgeos-redis already exists."
          else
            echo "Creating Upstash Redis (forgeos-redis)..."
            OUT=$(flyctl redis create --name forgeos-redis --region dfw --no-replicas --org personal 2>&1)
            echo "$OUT"
            REDIS_URL=$(echo "$OUT" | grep -oE 'redis://[^[:space:]"""]+' | head -1)
            if [ -z "$REDIS_URL" ]; then
              echo "::error::Could not parse REDIS_URL from redis create output"
              exit 1
            fi
            flyctl secrets set --app forgeos-api-app "REDIS_URL=$REDIS_URL"
            flyctl secrets set --app forgeos-worker "REDIS_URL=$REDIS_URL"
          fi
          for app in forgeos-api-app forgeos-worker; do
            if flyctl secrets list --app "$app" 2>/dev/null | grep -q 'JWT_SECRET'; then
              echo "Secrets already set on $app."
            else
              echo "Generating secrets for $app..."
              flyctl secrets set --app "$app" \
                "JWT_SECRET=$(openssl rand -hex 32)" \
                "WEBHOOK_SECRET=$(openssl rand -hex 32)"
            fi
          done
          # Safe non-secret defaults (real AI keys are set separately)
          flyctl secrets set --app forgeos-api-app LLM_PROVIDER=stub CHANNEL_MODE=stub
          flyctl secrets set --app forgeos-worker LLM_PROVIDER=stub CHANNEL_MODE=stub
          # Security hardening: production fail-closed guards. ENV=production
          # enables the JWT-secret strength check, CORS wildcard refusal,
          # and HSTS. CORS_ORIGINS must be explicit — the code default is
          # localhost-only and would block the production frontend.
          flyctl secrets set --app forgeos-api-app ENV=production
          flyctl secrets set --app forgeos-worker ENV=production
          flyctl secrets set --app forgeos-api-app CORS_ORIGINS=https://forgeos-web.fly.dev

      - name: Ensure public IPs for api + web
        run: |
          for app in forgeos-api-app forgeos-web; do
            flyctl ips allocate-v4 --app "$app" --yes 2>&1 | tail -1 || true
            flyctl ips allocate-v6 --app "$app" --yes 2>&1 | tail -1 || true
          done

      - name: Deploy API (runs Alembic migrations first)
        run: flyctl deploy --remote-only --config deploy/fly/api.toml --dockerfile apps/api/Dockerfile .

      - name: Deploy worker
        run: flyctl deploy --remote-only --config deploy/fly/worker.toml --dockerfile apps/worker/Dockerfile .

      - name: Deploy web
        run: flyctl deploy --remote-only --config deploy/fly/web.toml .

      - name: Smoke test live endpoints
        run: |
          sleep 25
          echo "--- API health ---"
          curl -sf https://forgeos-api-app.fly.dev/healthz
          echo ""
          echo "--- Web ---"
          curl -sf -o /dev/null -w "web: %{http_code}\n" https://forgeos-web.fly.dev/
