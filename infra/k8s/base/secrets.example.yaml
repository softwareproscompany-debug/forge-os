# EXAMPLE ONLY — copy to secrets.yaml, fill in real values, and NEVER commit it.
#   cp infra/k8s/base/secrets.example.yaml infra/k8s/base/secrets.yaml
# Then add `secrets.yaml` to the kustomization resources (it is intentionally
# NOT referenced by kustomization.yaml so the example can't be applied as-is).
apiVersion: v1
kind: Secret
metadata:
  name: forgeos-secrets
  namespace: forgeos
type: Opaque
stringData:
